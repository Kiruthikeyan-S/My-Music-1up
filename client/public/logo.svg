<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" shape-rendering="crispEdges">
  <!-- Black Pixel Background / Outline -->
  <path d="
    M10,15 h70 v25 h-10 v5 h-60 v-30 z
    M5,20 h10 v5 h-5 v10 h5 v5 h-10 z
    M80,20 h5 v15 h-5 z
  " fill="#000000" />
  
  <!-- Outer Outline Base -->
  <rect x="5" y="18" width="80" height="24" fill="#000000" rx="3" />
  <rect x="10" y="15" width="70" height="30" fill="#000000" rx="3" />

  <!-- '1' Character (Neon Green + White Highlight) -->
  <rect x="10" y="20" width="4" height="4" fill="#00e600" />
  <rect x="14" y="18" width="9" height="24" fill="#00e600" />
  <!-- White shine on 1 -->
  <rect x="14" y="18" width="4" height="4" fill="#ffffff" />

  <!-- Separator space -->
  <rect x="25" y="15" width="4" height="30" fill="#000000" />

  <!-- 'U' Character -->
  <rect x="29" y="18" width="20" height="24" fill="#00e600" />
  <rect x="37" y="18" width="4" height="16" fill="#000000" />
  <!-- White shine on U -->
  <rect x="29" y="18" width="4" height="4" fill="#ffffff" />
  <rect x="45" y="18" width="4" height="4" fill="#ffffff" />

  <!-- Separator space -->
  <rect x="51" y="15" width="4" height="30" fill="#000000" />

  <!-- 'P' Character -->
  <rect x="55" y="18" width="20" height="24" fill="#00e600" />
  <rect x="63" y="24" width="4" height="6" fill="#000000" />
  <rect x="63" y="34" width="12" height="8" fill="#000000" />
  <!-- White shine on P -->
  <rect x="55" y="18" width="4" height="4" fill="#ffffff" />
  
  <!-- Outer border strokes for pixel fidelity -->
  <rect x="10" y="15" width="65" height="3" fill="#000000" />
  <rect x="10" y="42" width="65" height="3" fill="#000000" />
  <rect x="5" y="22" width="5" height="16" fill="#000000" />
  <rect x="75" y="22" width="5" height="16" fill="#000000" />
</svg>
